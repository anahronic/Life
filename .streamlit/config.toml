[theme]
primaryColor = "#D4AF37"
backgroundColor = "#0B0B0B"
secondaryBackgroundColor = "#141416"
textColor = "#dddddd"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "minimal"

[server]
port = 8501
headless = true
runOnSave = false
maxUploadSize = 200
enableXsrfProtection = true
baseUrlPath = "ayalon"

[logger]
level = "info"

[browser]
gatherUsageStats = false
serverAddress = "dikenocracy.com"
serverPort = 443
