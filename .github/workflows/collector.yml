name: Collect traffic history (disabled)

# The scheduled GitHub Actions collector is retired (2026-09-24):
#  * production collection runs on the VPS (ayalon-collector.timer) with
#    methodology v2 and its own database; a second collector would consume
#    the same provider quota and produce a divergent, unaudited history;
#  * history/monitor.sqlite3 is kept only as a frozen v1 archive.
# Manual runs remain possible for diagnostics and do NOT commit anything.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Collect once (scratch database, not committed)
        env:
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          HISTORY_DB_PATH: /tmp/scratch.sqlite3
        run: python collector.py --once || true
